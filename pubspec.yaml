name: rice_yield_app
description: An agricultural rice yield prediction app with video upload and analysis features.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/Images/

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0

  # State Management
  riverpod: ^3.0.3
  flutter_riverpod: ^3.0.3

  # Navigation
  go_router: ^17.0.0

  # Authentication & API
  supabase_flutter: ^2.12.0
  http: ^1.6.0
  cloudinary_public: ^0.21.0
  flutter_web_auth_2: ^4.1.0


  # Video & Files
  image_picker: ^1.2.1
  video_player: ^2.10.1

  # Storage
  shared_preferences: ^2.5.4

  # UI Utilities
  fluttertoast: ^9.0.0
  loading_animation_widget: ^1.3.0

  # Charts for reports
  fl_chart: ^1.1.1
  flutter_tts: ^3.8.5

  # Date formatting
  intl: ^0.20.2
  file_picker: ^10.3.8
  pdf: ^3.11.3
  syncfusion_flutter_charts: ^32.1.20
  share_plus: ^12.0.1
  printing: ^5.14.2
  iconsax: ^0.0.8
  flutter_avif: ^2.3.0
  # video_thumbnail: ^0.5.6  # disabled: breaks Android build (jcenter shut down)
  riverpod_annotation: ^3.0.0-dev.3
  http_parser: ^4.1.2
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.0-dev.11
  custom_lint: ^0.5.11
  riverpod_lint: ^3.0.0-dev.4
  flutter_launcher_icons: ^0.13.1

flutter_native_splash:
  color: "#132A13"
  image: assets/logos/logo-dark-bg-remove.png
  android: true
  ios: false
  android_12:
    color: "#132A13"
    image: assets/logos/logo-dark-bg-remove.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logos/logo-dark-bg-remove.png"
  adaptive_icon_background: "#132A13"
  adaptive_icon_foreground: "assets/logos/logo-dark-bg-remove.png"

